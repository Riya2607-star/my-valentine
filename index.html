<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #ff7eb3, #ff758c);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    .box {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 100px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background: white;
      color: #ff4f8b;
      margin-right: 20px;
    }

    #no {
      background: #ff4f8b;
      color: white;
      position: absolute;
    }

    .message {
      margin-top: 25px;
      font-size: 20px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>💘🥰😘 Hi Honey 😍💘</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
      <button id="yes">YES 💖</button>
      <button id="no">NO 😅</button>
    </div>

    <div class="message" id="msg">
      Oh no 😢 I’ll still smile anyway 🌸
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 300 - 150;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
      msg.style.display = "block";
      msg.innerHTML = "Yayyy 🥰 You made my day 💖";
    });
  </script>
</body>
</html>
